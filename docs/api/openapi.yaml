      summary: Check the status of an approval gate created via external evaluation
      security:
        - apiKeyAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [callerIdentity]
              properties:
