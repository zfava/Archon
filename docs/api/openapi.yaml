      responses:
        '200':
          description: Evaluation result with signed digest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEvaluationResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or missing API key
        '429':
          description: Rate limit exceeded
  /api/v1/external/governance/evaluation/{evaluationId}:
    get:
      operationId: getExternalEvaluation
      tags: [ExternalGovernance]
      summary: Retrieve a previous governance evaluation by ID
      security:
        - apiKeyAuth: []
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Evaluation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEvaluationResponse'
        '404':
          description: Evaluation not found
