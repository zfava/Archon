  # ═══════════════════════════════════════════════════════════════════
  # Trust Visibility Endpoints (TrustVisibilityEndpoints.cs)
  # ═══════════════════════════════════════════════════════════════════
  /api/v1/trust-visibility/lineage/{decisionId}:
    get:
      operationId: getTrustLineage
      tags: [TrustVisibility]
      summary: >
        Get full trust lineage for a decision: decision → approval gates →
        governed actions → outcomes → proof timeline
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete trust lineage trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisionId:
                    type: string
                    format: uuid
                  decision:
                    type: object
                    properties:
                      title:
                        type: string
                      domain:
                        type: string
                      objective:
                        type: string
                      reversibility:
                        type: string
                      riskLevel:
                        type: string
                      confidence:
                        type: number
                      expectedValue:
                        type: number
                      status:
                        type: string
                      createdBy:
                        type: string
                      createdAtUtc:
                        type: string
                        format: date-time
                      requiresApproval:
                        type: boolean
                  approvalGates:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalGate'
                  governedActions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        actionType:
                          type: string
                        description:
                          type: string
                        status:
                          type: string
                        executedBy:
                          type: string
                        executedAtUtc:
                          type: string
                          format: date-time
                        safety:
                          type: object
                          properties:
                            reversibility:
                              type: string
                            rollbackSupported:
                              type: boolean
                            rollbackStrategy:
                              type: string
                  outcome:
                    type: object
                    properties:
                      expectedOutcomeSummary:
                        type: string
                      expectedValue:
                        type: number
                      confidenceAtPrediction:
                        type: number
                      actualOutcomeSummary:
                        type: string
                      actualValue:
                        type: number
                      valueVariance:
                        type: number
                      variancePercent:
                        type: number
                      direction:
                        type: string
                      assessment:
                        type: string
                  proofTimeline:
                    type: object
                    properties:
                      decisionTitle:
                        type: string
                      domain:
                        type: string
                      totalEvents:
                        type: integer
                      events:
                        type: array
                        items:
                          type: object
                      summary:
                        type: object
                  statusHistory:
                    type: array
                    items:
                      type: object
                  lineageSummary:
                    type: object
                    properties:
                      hasApproval:
                        type: boolean
                      hasExecution:
                        type: boolean
                      hasOutcome:
                        type: boolean
                      hasProofTrail:
                        type: boolean
                      allActionsReversible:
                        type: boolean
                      anyRollbackAttempted:
                        type: boolean
                      varianceWithinThreshold:
                        type: boolean
        '400':
          description: Invalid tenant_id
        '401':
          description: Not authenticated
        '404':
          description: Decision not found
  /api/v1/trust-visibility/posture:
    get:
      operationId: getTrustPosture
      tags: [TrustVisibility]
      summary: Get tenant-wide governance health and trust posture summary
      responses:
        '200':
          description: Trust posture summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                    format: uuid
                  generatedAtUtc:
                    type: string
                    format: date-time
                  governance:
                    type: object
                    properties:
                      activePolicies:
                        type: integer
                      totalPolicies:
                        type: integer
                      pendingApprovals:
                        type: integer
                      recentApprovals:
                        type: object
                        properties:
                          total:
                            type: integer
                          approved:
                            type: integer
                          denied:
                            type: integer
                          approvalRate:
                            type: number
                      separationOfDutiesEnforced:
                        type: boolean
                  safety:
                    type: object
                    properties:
                      totalActions:
                        type: integer
                      reversible:
                        type: integer
                      compensatable:
                        type: integer
                      irreversible:
                        type: integer
                      reversibilityRate:
                        type: number
                      rollbacksAttempted:
                        type: integer
                      rollbacksSucceeded:
                        type: integer
                      rollbacksFailed:
                        type: integer
                      rollbackSuccessRate:
                        type: number
                  trustTiers:
                    type: object
                    properties:
                      totalPolicies:
                        type: integer
                      enabledPolicies:
                        type: integer
                      actionsCovered:
                        type: integer
                      requiresReversible:
                        type: integer
                  outcomes:
                    type: object
                    description: Calibration summary from outcome learning
                  proofAnalytics:
                    type: object
                    description: Proof analytics dashboard data
        '401':
          description: Not authenticated

