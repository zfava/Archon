# ArchonAI Load Test CI Pipeline
# Runs on release branches and manual dispatch.
# Produces machine-readable JSON + summary artifacts.

name: Load Tests

on:
  push:
    branches:
      - 'release/**'
      - 'main'
    paths:
      - 'archonai/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    branches:
      - 'release/**'
    paths:
      - 'archonai/**'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Specific scenario to run (leave empty for all)'
        required: false
        default: ''
      quick_mode:
        description: 'Quick mode (reduced durations for preview)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  load-test:
    name: k6 Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: archonai
          POSTGRES_PASSWORD: archonai_test
          POSTGRES_DB: archonai_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
          - 8222:8222
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Build ArchonAI
        working-directory: archonai
        run: dotnet build ArchonAI.slnx -c Release --no-incremental -p:NoWarn=NU1902%3BNU1510

      - name: Start API Server
        working-directory: archonai
        env:
          ASPNETCORE_URLS: http://+:8080
          ARCHONAI_JWT_SIGNING_KEY: LoadTestSigningKey2026SecureEnoughForCI!
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=archonai_loadtest;Username=archonai;Password=archonai_test
          EventBus__UseNats: 'true'
          EventBus__Url: nats://localhost:4222
        run: |
          dotnet run --project src/ArchonAI.Api/ArchonAI.Api.csproj -c Release --no-build &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

          # Wait for API to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz/live > /dev/null 2>&1; then
              echo "API is ready."
              break
            fi
            echo "Waiting for API... attempt $i/30"
            sleep 2
          done

      - name: Run Load Tests
        env:
          BASE_URL: http://localhost:8080
          REPORT_DIR: ${{ github.workspace }}/load-test-results
          SOAK_VUS: '10'
          SOAK_DURATION: '2m'
        run: |
          mkdir -p "$REPORT_DIR"

          SCENARIO="${{ github.event.inputs.scenario }}"
          QUICK="${{ github.event.inputs.quick_mode }}"

          cd archonai/tests/load

          if [[ -n "$SCENARIO" ]]; then
            chmod +x run-all.sh
            ./run-all.sh "$SCENARIO"
          elif [[ "$QUICK" == "true" ]] || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            chmod +x run-all.sh
            ./run-all.sh --quick
          else
            chmod +x run-all.sh
            ./run-all.sh
          fi

      - name: Stop API Server
        if: always()
        run: |
          if [[ -n "${API_PID:-}" ]]; then
            kill "$API_PID" 2>/dev/null || true
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.sha }}
          path: load-test-results/
          retention-days: 30

      - name: Generate Summary
        if: always()
        run: |
          RESULTS_DIR="${{ github.workspace }}/load-test-results"

          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find the consolidated summary
          SUMMARY_FILE=$(ls "$RESULTS_DIR"/summary-*.json 2>/dev/null | tail -1 || echo "")

          if [[ -f "$SUMMARY_FILE" ]]; then
            PASSED=$(jq -r '.passed' "$SUMMARY_FILE")
            FAILED=$(jq -r '.failed' "$SUMMARY_FILE")
            TOTAL=$(jq -r '.total' "$SUMMARY_FILE")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| Total  | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Scenario Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            jq -r '.scenarios[]' "$SUMMARY_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No summary file found. Check individual scenario logs in artifacts." >> $GITHUB_STEP_SUMMARY
          fi

          # List all generated report files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download the \`load-test-results-${{ github.sha }}\` artifact for full JSON reports." >> $GITHUB_STEP_SUMMARY
