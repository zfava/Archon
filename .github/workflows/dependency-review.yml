# Dependency Review — blocks PRs that introduce high-severity vulnerabilities.
#
# PREREQUISITE: GitHub Dependency Graph must be enabled on this repository.
#   → Settings → Code security and analysis → Dependency graph → Enable
#
# Without Dependency Graph the review step cannot retrieve the dependency diff
# and this workflow will fail with a clear error message explaining why.

name: Dependency review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pre-flight: verify that the Dependency Graph API is available.
      # The dependency-review-action calls this endpoint internally; if it
      # returns 404 or 403 the action fails with an opaque error.
      - name: Check Dependency Graph is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Dependency Graph API is reachable."
          else
            echo "::error::Dependency Graph is not enabled for this repository (HTTP $HTTP_CODE)."
            echo "::error::Enable it at: https://github.com/${{ github.repository }}/settings/security_analysis"
            echo "::error::Settings → Code security and analysis → Dependency graph → Enable"
            exit 1
          fi

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
