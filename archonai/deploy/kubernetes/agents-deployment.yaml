apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-agents
  namespace: archonai
  labels:
    app.kubernetes.io/name: archonai-agents
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: archonai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: archonai-agents
  template:
    metadata:
      labels:
        app: archonai-agents
    spec:
      containers:
        - name: agents
          image: archonai/agents:latest
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
