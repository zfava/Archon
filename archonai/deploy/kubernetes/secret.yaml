# ── ArchonAI Kubernetes Secret ──────────────────────────────────────
# This is a TEMPLATE. Replace placeholder values before applying.
# Generate secrets:
#   ARCHONAI_JWT_SIGNING_KEY: openssl rand -base64 48
#   ARCHONAI_DB_PASSWORD: openssl rand -base64 24
#
# Apply with:
#   kubectl create secret generic archonai-secrets \
#     --namespace=archonai \
#     --from-literal=ARCHONAI_JWT_SIGNING_KEY="$(openssl rand -base64 48)" \
#     --from-literal=ARCHONAI_DB_USERNAME="archonai" \
#     --from-literal=ARCHONAI_DB_PASSWORD="$(openssl rand -base64 24)"
# ────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: archonai-secrets
  namespace: archonai
type: Opaque
stringData:
  ARCHONAI_JWT_SIGNING_KEY: ""  # REQUIRED: replace or use kubectl create secret
  ARCHONAI_DB_USERNAME: ""      # REQUIRED: replace or use kubectl create secret
  ARCHONAI_DB_PASSWORD: ""      # REQUIRED: replace or use kubectl create secret
