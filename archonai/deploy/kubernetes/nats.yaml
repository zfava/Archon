apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-nats
  namespace: archonai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archonai-nats
  template:
    metadata:
      labels:
        app: archonai-nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-nats
  namespace: archonai
spec:
  selector:
    app: archonai-nats
  ports:
    - name: nats
      protocol: TCP
      port: 4222
      targetPort: 4222
