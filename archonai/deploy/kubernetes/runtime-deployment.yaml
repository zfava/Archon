apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-runtime
  namespace: archonai
  labels:
    app.kubernetes.io/name: archonai-runtime
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: archonai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: archonai-runtime
  template:
    metadata:
      labels:
        app: archonai-runtime
    spec:
      containers:
        - name: runtime
          image: archonai/runtime:latest
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
          env:
            - name: Runtime__MaxDegreeOfParallelism
              value: "128"
            - name: Runtime__MaxRetries
              value: "2"
            - name: Runtime__BaseRetryDelayMs
              value: "250"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
