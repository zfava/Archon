apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-scheduler
  namespace: archonai
  labels:
    app.kubernetes.io/name: archonai-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: archonai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archonai-scheduler
  template:
    metadata:
      labels:
        app: archonai-scheduler
    spec:
      containers:
        - name: scheduler
          image: archonai/scheduler:latest
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
          env:
            - name: Scheduler__MaxGpuSlots
              value: "4"
            - name: Scheduler__MaxParallelTasks
              value: "128"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
