apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-scheduler
  namespace: archonai
  labels:
    app.kubernetes.io/name: archonai-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: archonai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archonai-scheduler
  template:
    metadata:
      labels:
        app: archonai-scheduler
    spec:
      containers:
        - name: scheduler
          image: archonai/scheduler:latest
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
          env:
            - name: Scheduler__MaxGpuSlots
              value: "4"
            - name: Scheduler__MaxParallelTasks
              value: "128"
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
