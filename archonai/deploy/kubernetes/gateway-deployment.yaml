apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-gateway
  namespace: archonai
  labels:
    app.kubernetes.io/name: archonai-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: archonai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: archonai-gateway
  template:
    metadata:
      labels:
        app: archonai-gateway
    spec:
      containers:
        - name: gateway
          image: archonai/gateway:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ReverseProxy__Clusters__api-cluster__Destinations__api-1__Address
              value: http://archonai-api:80
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-gateway
  namespace: archonai
spec:
  type: LoadBalancer
  selector:
    app: archonai-gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
