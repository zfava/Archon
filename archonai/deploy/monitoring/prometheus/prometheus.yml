# ══════════════════════════════════════════════════════════════════
#  ArchonAI — Prometheus Configuration
# ══════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Placeholder: configure Alertmanager when deployed
      # - targets: ['alertmanager:9093']

scrape_configs:
  # ── Prometheus self-monitoring ──────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── ArchonAI Gateway ───────────────────────────────────────────
  - job_name: archonai-gateway
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: gateway
          tier: edge

  # ── ArchonAI API ───────────────────────────────────────────────
  - job_name: archonai-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['api:8080']
        labels:
          service: api
          tier: core

  # ── ArchonAI Runtime Worker ────────────────────────────────────
  - job_name: archonai-runtime
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['runtime:9464']
        labels:
          service: runtime
          tier: worker

  # ── ArchonAI Scheduler Worker ──────────────────────────────────
  - job_name: archonai-scheduler
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['scheduler:9464']
        labels:
          service: scheduler
          tier: worker

  # ── ArchonAI Agents Worker ─────────────────────────────────────
  - job_name: archonai-agents
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ['agents:9464']
        labels:
          service: agents
          tier: worker

  # ── PostgreSQL (via pg_exporter if deployed) ───────────────────
  # Uncomment when postgres_exporter is added:
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # ── NATS monitoring ────────────────────────────────────────────
  - job_name: nats
    metrics_path: /
    scrape_interval: 15s
    static_configs:
      - targets: ['nats:8222']
        labels:
          service: nats
          tier: infrastructure
