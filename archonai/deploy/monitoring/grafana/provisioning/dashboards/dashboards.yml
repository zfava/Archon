# ══════════════════════════════════════════════════════════════════
#  ArchonAI — Grafana Dashboard Provisioning
# ══════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: ArchonAI
    orgId: 1
    folder: ArchonAI
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
