{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-scheduler
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: archonai
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      app: archonai-scheduler
  template:
    metadata:
      labels:
        app: archonai-scheduler
        app.kubernetes.io/name: archonai-scheduler
        app.kubernetes.io/component: scheduler
      annotations:
        {{- include "archonai.vaultAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: scheduler
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: {{ .Values.scheduler.healthPort | default 8081 }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: archonai-scheduler-config
            {{- if ne .Values.secrets.provider "vault-injector" }}
            - secretRef:
                name: archonai-secrets
            {{- end }}
          env:
            {{- include "archonai.vaultEnv" . | nindent 12 }}
          {{- with .Values.scheduler.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.scheduler.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.scheduler.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "archonai.vaultVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "archonai.vaultVolume" . | nindent 8 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: archonai-scheduler-config
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.scheduler.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
