{{- if .Values.runtime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-runtime
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-runtime
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: archonai
spec:
  replicas: {{ .Values.runtime.replicaCount }}
  selector:
    matchLabels:
      app: archonai-runtime
  template:
    metadata:
      labels:
        app: archonai-runtime
        app.kubernetes.io/name: archonai-runtime
        app.kubernetes.io/component: runtime
      annotations:
        {{- include "archonai.vaultAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: runtime
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.runtime.image.repository }}:{{ .Values.runtime.image.tag }}"
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: archonai-runtime-config
            {{- if ne .Values.secrets.provider "vault-injector" }}
            - secretRef:
                name: archonai-secrets
            {{- end }}
          env:
            {{- include "archonai.vaultEnv" . | nindent 12 }}
          {{- with .Values.runtime.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "archonai.vaultVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "archonai.vaultVolume" . | nindent 8 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: archonai-runtime-config
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.runtime.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
