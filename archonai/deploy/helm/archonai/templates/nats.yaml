apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-nats
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archonai-nats
  template:
    metadata:
      labels:
        app: archonai-nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-nats
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: archonai-nats
  ports:
    - port: 4222
      targetPort: 4222
      protocol: TCP
      name: nats
