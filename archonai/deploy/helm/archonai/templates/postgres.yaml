apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: archonai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archonai-postgres
  template:
    metadata:
      labels:
        app: archonai-postgres
        app.kubernetes.io/name: archonai-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: archonai-postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: archonai-postgres-credentials
                  key: password
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: archonai-postgres-pvc
---
apiVersion: v1
kind: Secret
metadata:
  name: archonai-postgres-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: archonai
type: Opaque
data:
  username: {{ .Values.postgres.username | b64enc | quote }}
  password: {{ .Values.postgres.password | b64enc | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archonai-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app: archonai-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
