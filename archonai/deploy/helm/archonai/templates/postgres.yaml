apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archonai-postgres
  template:
    metadata:
      labels:
        app: archonai-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: archonai-postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
