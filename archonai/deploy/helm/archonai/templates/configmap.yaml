apiVersion: v1
kind: ConfigMap
metadata:
  name: archonai-config
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: archonai
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: archonai
        orgId: 1
        folder: ArchonAI
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: grafana
    app.kubernetes.io/part-of: archonai
data:
  archonai-operations.json: |
    {{- .Files.Get "dashboards/archonai-operations.json" | nindent 4 }}
  archonai-security.json: |
    {{- .Files.Get "dashboards/archonai-security.json" | nindent 4 }}
