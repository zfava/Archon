{{- if .Values.agents.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-agents
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-agents
    app.kubernetes.io/component: agents
    app.kubernetes.io/part-of: archonai
spec:
  replicas: {{ .Values.agents.replicaCount }}
  selector:
    matchLabels:
      app: archonai-agents
  template:
    metadata:
      labels:
        app: archonai-agents
        app.kubernetes.io/name: archonai-agents
        app.kubernetes.io/component: agents
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: agents
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.agents.image.repository }}:{{ .Values.agents.image.tag }}"
          imagePullPolicy: {{ .Values.agents.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: archonai-agents-config
            - secretRef:
                name: archonai-secrets
          {{- with .Values.agents.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: archonai-agents-config
  namespace: {{ .Values.namespace }}
data:
{{- range $key, $value := .Values.agents.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
