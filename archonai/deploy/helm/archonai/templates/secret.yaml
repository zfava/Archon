{{- if eq .Values.secrets.provider "inline" }}
# ── Kubernetes Secret: inline mode ─────────────────────────────────
# Secrets are provided via --set or values override at install time.
# NEVER commit actual secret values to values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: archonai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: archonai
    app.kubernetes.io/managed-by: helm
type: Opaque
stringData:
  ARCHONAI_JWT_SIGNING_KEY: {{ required "security.jwtSigningKey must be provided via --set (never commit to values.yaml)" .Values.security.jwtSigningKey | quote }}
  {{- if .Values.security.jwtSigningKeyPrevious }}
  ARCHONAI_JWT_SIGNING_KEY_PREVIOUS: {{ .Values.security.jwtSigningKeyPrevious | quote }}
  {{- end }}
  {{- if .Values.security.totpEncryptionKey }}
  ARCHONAI_TOTP_ENCRYPTION_KEY: {{ .Values.security.totpEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.postgres.password }}
  ARCHONAI_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.postgres.username }}
  ARCHONAI_DB_USERNAME: {{ .Values.postgres.username | quote }}
  {{- end }}
  {{- with .Values.secrets.additionalSecrets }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if eq .Values.secrets.provider "external-secrets" }}
# ── ExternalSecret: secrets fetched from external store ───────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: archonai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: archonai
    app.kubernetes.io/managed-by: helm
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecrets.secretStoreRef.name is required for external-secrets provider" .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: archonai-secrets
    creationPolicy: Owner
  data:
    - secretKey: ARCHONAI_JWT_SIGNING_KEY
      remoteRef:
        key: {{ required "secrets.externalSecrets.remoteRefs.jwtSigningKey is required" .Values.secrets.externalSecrets.remoteRefs.jwtSigningKey }}
    {{- if .Values.secrets.externalSecrets.remoteRefs.jwtSigningKeyPrevious }}
    - secretKey: ARCHONAI_JWT_SIGNING_KEY_PREVIOUS
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.jwtSigningKeyPrevious }}
    {{- end }}
    {{- if .Values.secrets.externalSecrets.remoteRefs.totpEncryptionKey }}
    - secretKey: ARCHONAI_TOTP_ENCRYPTION_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.totpEncryptionKey }}
    {{- end }}
    {{- if .Values.secrets.externalSecrets.remoteRefs.postgresUsername }}
    - secretKey: ARCHONAI_DB_USERNAME
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.postgresUsername }}
    {{- end }}
    {{- if .Values.secrets.externalSecrets.remoteRefs.postgresPassword }}
    - secretKey: ARCHONAI_DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.postgresPassword }}
    {{- end }}
    {{- if .Values.secrets.externalSecrets.remoteRefs.modelProviderApiKey }}
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.modelProviderApiKey }}
    {{- end }}
    {{- range .Values.secrets.externalSecrets.additionalRemoteRefs }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRefKey }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
    {{- end }}
{{- end }}
---
{{- if and (eq .Values.secrets.provider "inline") .Values.topology.bundledInfra }}
# ── Postgres credentials (inline mode with bundled infra) ──────────
apiVersion: v1
kind: Secret
metadata:
  name: archonai-postgres-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: archonai
type: Opaque
data:
  username: {{ required "postgres.username must be provided via --set" .Values.postgres.username | b64enc | quote }}
  password: {{ required "postgres.password must be provided via --set" .Values.postgres.password | b64enc | quote }}
{{- end }}
{{- if and (eq .Values.secrets.provider "external-secrets") .Values.topology.bundledInfra .Values.secrets.externalSecrets.remoteRefs.postgresUsername .Values.secrets.externalSecrets.remoteRefs.postgresPassword }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: archonai-postgres-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: archonai
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: archonai-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.postgresUsername }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.postgresPassword }}
{{- end }}
