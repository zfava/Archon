{{- if eq .Values.secrets.provider "external-secrets" }}
# ── ExternalSecret: secrets fetched from external store ───────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: archonai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: archonai
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: archonai-secrets
    creationPolicy: Owner
  data:
    - secretKey: ARCHONAI_JWT_SIGNING_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.jwtSigningKey }}
    {{- if .Values.secrets.externalSecrets.remoteRefs.modelProviderApiKey }}
    - secretKey: ModelProviders__OpenAI__ApiKey
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.modelProviderApiKey }}
    {{- end }}
---
{{- if and .Values.secrets.externalSecrets.remoteRefs.postgresUsername .Values.secrets.externalSecrets.remoteRefs.postgresPassword }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: archonai-postgres-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: archonai
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: archonai-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.postgresUsername }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.remoteRefs.postgresPassword }}
{{- end }}
{{- else }}
# ── Inline secrets (default) ─────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: archonai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: archonai
type: Opaque
stringData:
  ARCHONAI_JWT_SIGNING_KEY: {{ .Values.security.jwtSigningKey | quote }}
{{- end }}
