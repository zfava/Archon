apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: archonai-api
  template:
    metadata:
      labels:
        app: archonai-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-api
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: archonai-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
