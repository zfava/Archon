apiVersion: apps/v1
kind: Deployment
metadata:
  name: archonai-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: archonai
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: archonai-api
  template:
    metadata:
      labels:
        app: archonai-api
        app.kubernetes.io/name: archonai-api
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: archonai-config
            - secretRef:
                name: archonai-secrets
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: archonai-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: archonai-api
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: archonai-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
